# 默认适用于 640x480 摄像头；修改后重启 launch。
camera_node:
  ros__parameters:
    device_id: 0
    width: 640
    height: 480
    fps: 30

basketball_detector:
  ros__parameters:
    # 霍夫圆：先调半径范围，再调 param2。
    dp: 1.2             # 累加器分辨率比例；越大越快，圆心越粗糙。
    min_dist: 70        # 候选圆心的最小间距（像素）。
    param1: 120         # Canny 高阈值；低阈值约为一半。
    param2: 30          # 圆投票阈值；降低可减轻漏检，也会增加误检。
    min_radius: 18      # 球的最小半径（像素）。
    max_radius: 0       # 0 表示不限；近距离大球可保持 0。
    blur_kernel: 7      # 高斯模糊核，自动转为不小于 3 的奇数。

    # HSV 只用于验证候选圆，不参与找圆。
    # H 使用 OpenCV 的 0..179 标度；S/V 使用 0..255 标度。
    # 当前范围偏向饱和的橙色，压制手部和浅橙背景的低饱和亮色。
    h_min: 5
    h_max: 22
    s_min: 115
    v_min: 40
    v_max: 205

    # 验证：分别满足下限，再按 65% 圆周 + 35% 颜色评分。
    min_color_fraction: 0.35   # 暗色缝线多时可降回 0.28~0.32。
    min_edge_fraction: 0.18    # 人脸误检时可提高。
    min_visible_fraction: 0.55 # 允许近距离篮球被画面截断。
    min_score: 0.50            # 接受阈值，范围 0..1；过滤 0.3~0.4 的噪声。

basketball_display:
  ros__parameters:
    display_fps: 30.0
